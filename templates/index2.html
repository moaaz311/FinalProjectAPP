</button>

<!-- CHAT -->

    <div class="chatTitle">🤖 AI Assistant</div>
    <button class="chatCloseBtn" onclick="closeChat()" type="button" aria-label="Close chat">×</button>
</div>

<div id="messages">

</div>

<div class="chatBottom">

id="userInput"
placeholder="Ask question..."
>

</button>

</div>

</div>

<!-- TABLE FULL VIEW MODAL -->
<div id="tableFullViewModal" class="tableFullViewModal" aria-hidden="true">
    <div class="tableFullViewBox">
        <div class="tableFullViewHeader">
            <div class="tableFullViewTitle">Full Table View</div>
            <button id="closeTableFullViewBtn" class="tableFullViewClose" type="button" onclick="closeTableFullView()">×</button>
        </div>
        <div id="tableFullViewContent" class="tableFullViewContent"></div>
    </div>
</div>


<!-- EMAIL -->

<div id="emailModal">

type="checkbox"
value="Full_Light_Mode_PowerBI">

</label>

<input
type="checkbox"
value="TradeExecutive">

Trade Executive

</label>

</div>

<input
    type="email"
    id="email"
    placeholder="Enter email"
/>

    Send PDF
</button>
</div>




<!-- UPDATE ALERTS -->

<div id="updatesModal">

<div style="font-size:18px;font-weight:bold;margin-bottom:10px">
Report Update Alerts
</div>

<div class="modal-note">
Enter your email and choose whether you want to receive notifications when a dashboard/report name is updated.
</div>

<input
    type="email"
    id="updatesEmail"
    placeholder="Enter email"
/>

<label class="update-choice">
<input
    type="checkbox"
    id="updatesEnabled"
    checked
/>
<span>I want to receive dashboard update notifications</span>
</label>

<button onclick="saveUpdatePreference()">
    Save Preference
</button>

<div id="updateStatus"></div>

</div>


<script>

function showReport(id){

document
.querySelectorAll(
"iframe"
)
.forEach(x=>{

x.classList.remove(
"active"
)

})

document
.getElementById(
id
)
.classList.add(
"active"
)

}

/* CHAT */

function openChat(){

const c = document.getElementById("chatModal");
const b = document.getElementById("aiFloatingBtn");
const input = document.getElementById("userInput");

c.classList.add("open");
if(b){ b.classList.add("active"); }

setTimeout(function(){
    if(input){ input.focus(); }
}, 80);

}

function closeChat(){

const c = document.getElementById("chatModal");
const b = document.getElementById("aiFloatingBtn");

c.classList.remove("open");
if(b){ b.classList.remove("active"); }

}

function toggleChat(){

const c = document.getElementById("chatModal");

if(c.classList.contains("open")){
    closeChat();
}
else{
    openChat();
}

}

/* EMAIL */

function toggleEmail(){

let e=
document.getElementById(
"emailModal"
)

e.style.display=

e.style.display=="block"
?

"none"

:

"block"

}



function toggleUpdates(){

let u=
document.getElementById(
"updatesModal"
)

u.style.display=

u.style.display=="block"
?

"none"

:

"block"

}

async function saveUpdatePreference(){

const email=
document.getElementById(
"updatesEmail"
).value.trim();

const enabled=
document.getElementById(
"updatesEnabled"
).checked;

const statusBox=
document.getElementById(
"updateStatus"
);

if(!email){

alert(
"Enter email"
);

return;

}

const selectedReports=

Array.from(

document.querySelectorAll(
".report-options input:checked"
)

)

.map(

x=>x.value

);

const payload={

email:email,

reports:
selectedReports.length > 0
?
selectedReports
:
["ALL"]

};

const endpoint=
enabled
?
"/subscribe-updates"
:
"/unsubscribe-updates";

try{

let response=

await fetch(

endpoint,

{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:
JSON.stringify(
payload
)

}

);

let data=
await response.json();

if(response.ok){

statusBox.style.color="#86efac";

}
else{

statusBox.style.color="#fecaca";

}

statusBox.innerText=
data.message ||
data.error ||
"Done";

}

catch(e){

console.log(e);

statusBox.style.color="#fecaca";

statusBox.innerText=
"Connection error";

}

}

function addMessage(message,sender){

    const chatBox=
    document.getElementById(
        "messages"
    );

    const bubble=
    document.createElement(
        "div"
    );

    bubble.className=
    sender==="user"
    ?
    "user-message"
    :
    "bot-message";

    // يسمح بعرض HTML styling
    bubble.innerHTML=
    message;

    chatBox.appendChild(
        bubble
    );

    enhanceWideTables(bubble);

    chatBox.scrollTop=
    chatBox.scrollHeight;

}

function enhanceWideTables(scope){

    const tables = scope.querySelectorAll(".ai-result-table");

    tables.forEach(function(table){

        if(table.closest(".ai-table-shell")){
            return;
        }

        const shell = document.createElement("div");
        shell.className = "ai-table-shell";

        table.parentNode.insertBefore(shell, table);
        shell.appendChild(table);

        const fullBtn = document.createElement("button");
        fullBtn.type = "button";
        fullBtn.className = "tableFullViewBtn";
        fullBtn.title = "Open full table view";
        fullBtn.setAttribute("aria-label", "Open full table view");
        fullBtn.innerHTML = "⛶";

        fullBtn.onclick = function(e){
            e.preventDefault();
            e.stopPropagation();
            openTableFullView(table);
        };

        shell.appendChild(fullBtn);

        requestAnimationFrame(function(){
            if(table.scrollWidth > shell.clientWidth + 8){
                shell.classList.add("is-wide");
            } else {
                shell.classList.add("is-normal");
            }
        });

    });

}

function openTableFullView(table){

    const modal = document.getElementById("tableFullViewModal");
    const content = document.getElementById("tableFullViewContent");

    if(!modal || !content){
        return;
    }

    content.innerHTML = "";

    const clonedTable = table.cloneNode(true);
    clonedTable.classList.add("ai-result-table-full");

    content.appendChild(clonedTable);

    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");

}

function closeTableFullView(){

    const modal = document.getElementById("tableFullViewModal");
    const content = document.getElementById("tableFullViewContent");

    if(content){
        content.innerHTML = "";
    }

    if(modal){
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
    }

}

document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
        closeTableFullView();
    }
});


async function sendMessage(){

    const input=
    document.getElementById(
        "userInput"
    );

    const msg=
    input.value.trim();

    if(!msg){

        return;
    }

    addMessage(
        msg,
        "user"
    );

    input.value="";

    try{

        const response=
        await fetch(

            "/chat",

            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json"

                },

                body:
                JSON.stringify({

                    message:msg

                })

            }

        );

        const data=
        await response.json();


        if(data.error){

            addMessage(

                "⚠️ "+data.error,

                "bot"

            );

            return;
        }

        addMessage(

            data.answer,

            "bot"

        );

    }

    catch(error){

        console.log(error);

        addMessage(

            "Connection Error",

            "bot"

        );

    }

}


// send on Enter
document.getElementById("userInput").addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        sendMessage();
    }
});

// close chat with Escape
document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
        closeChat();
    }
});
async function sendPDF(){

let email=
document.getElementById(
"email"
).value.trim();

if(!email){

alert(
"Enter email"
);

return;

}

let selectedReports=

Array.from(

document.querySelectorAll(
".report-options input:checked"
)

)

.map(

x=>x.value

);

if(
selectedReports.length===0
){

alert(
"Select at least one report"
);

return;

}

const payload={

email:email,

title:
"Dashboard Export",

reports:
selectedReports

};

console.log(
payload
);

try{

let response=

await fetch(

"/send-dashboard-pdf",

{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:
JSON.stringify(
payload
)

}

);

let data=
await response.json();

alert(
data.message ||
data.error
);

}

catch(e){

console.log(e);

alert(
"Connection error"
);

}

}
</script>

</body>
</html>
